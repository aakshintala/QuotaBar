name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


jobs:
  build:
    name: Build and Verify
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No explicit Swift toolchain setup: use the runner's bundled Xcode, the
      # same toolchain Tuist builds its macro prebuilts (SwiftSyntax) against.
      # Installing a separate toolchain via SwiftyLab/setup-swift drifted out of
      # sync with those prebuilts and broke the Release build ("SwiftSyntax was
      # created for incompatible target"). Mirrors the passing tests.yml.

      # Go builds the bundled quotad binary in the QuotaBar target's script phase.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: quotad/go.mod

      - name: Install Tuist
        run: brew install --cask tuist

      - name: Install Dependencies
        run: tuist install

      - name: Generate Project
        run: tuist generate --no-open

      - name: Build Debug
        run: xcodebuild build -scheme QuotaBar -workspace QuotaBar.xcworkspace -destination 'platform=macOS,arch=arm64'

      - name: Build Release
        # Ad-hoc sign on CI: the Release project settings name the Developer ID
        # identity, which needs the signing certificate the gate never installs.
        run: xcodebuild build -scheme QuotaBar -workspace QuotaBar.xcworkspace -destination 'platform=macOS,arch=arm64' -configuration Release CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
